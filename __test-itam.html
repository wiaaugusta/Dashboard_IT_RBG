<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/components.css" />
</head>
<body>
<div id="app"></div>
<pre id="out"></pre>
<script type="module">
  const mod = await import("/js/pages/__mpc-test.js");

  /* Item ITAM sesuai mapping baru: O..X. */
  const mk = (i, over = {}) => Object.assign({
    namaKomputer: `PC-${String(i).padStart(3, "0")}`,
    alamatIp: `10.10.1.${i}`,
    workgroup: "WORKGROUP",
    osName: `Windows 10 Pro x64 build ${(i % 3) + 1}`,
    groupAdministrator: i % 2 ? "Administrators" : "IT Admins Long Group Name",
    groupUser: `users-${i}`,
    itamVersion: `1.${i}.0`,
    statusPrivilege: i % 4 === 0 ? "NOK" : "OK",
    lastInventory: `2026-01-${String((i % 28) + 1).padStart(2, "0")}`,
    status: i % 5 === 0 ? "NIK DOBEL" : "NORMAL"
  }, over);

  const ITEMS = Array.from({ length: 40 }, (_, i) => mk(i + 1));
  const DETAIL_ROWS = [
    ["Nama Komputer", "Alamat IP", "Workgroup", "OS Name", "Group Administrator", "Group User", "Itam Version", "Status Privilege", "Last Inventory", "Status", "Source"],
    ["PC-001", "10.10.1.1", "WORKGROUP", "Windows 10 Pro x64 build 1", "Administrators", "users-1", "1.1.0", "NOK", "2026-01-02", "USER DOBEL", "ITAM OFFICE"]
  ];

  const container = document.getElementById("app");
  container.innerHTML = `
    <div class="mpc-page">
      ${mod.renderItamProblemSection ? mod.renderItamProblemSection() : ""}
      ${mod.renderItamTableSection ? mod.renderItamTableSection() : ""}
    </div>
  `;

  /* Stub cache module bindings via manual bind: reuse render fns only.
     bindEndpointTable tidak diekspor; uji render + fit saja di sini,
     perilaku bind diuji lewat struktur kolom. */
  const headHtml = mod.renderTableHead(mod.ITAM_TABLE_COLUMNS);
  const table = container.querySelector("[data-itam-head]");
  table.innerHTML = headHtml;
  container.querySelector("[data-itam-rows]").innerHTML = mod.renderItamRows(ITEMS.slice(0, 15), 0);
  container.querySelector("[data-itam-problem-rows]").innerHTML = mod.renderItamDetailRows(DETAIL_ROWS);

  const headers = [...table.querySelectorAll("th .mpc-table__th-label")].map((el) => el.textContent.trim());
  const sortableCount = [...table.querySelectorAll("th")].filter((th) => th.querySelector("[data-kav-sort-key]")).length;
  const firstRowCells = [...container.querySelector("[data-itam-rows] tr")?.querySelectorAll("td") || []].map((td) => td.textContent.trim());
  const problemFirstRow = [...container.querySelector("[data-itam-problem-rows] tr")?.querySelectorAll("td") || []].map((td) => td.textContent.trim());
  const problemHeaders = [...container.querySelectorAll(".mpc-kav-problem-table th .mpc-table__th-label")].map((el) => el.textContent.trim());

  const out = {
    headers,
    sortableCount,
    firstRowCells,
    problemHeaders,
    problemFirstRow,
    marqueeCount: container.querySelectorAll("[data-itam-rows] .mpc-kav-marquee").length,
    statusPills: [...container.querySelectorAll("[data-itam-rows] .mpc-kav-status")].slice(0, 3).map((el) => el.className.replace("mpc-kav-status ", "").trim())
  };

  const checks = {
    headersExact: JSON.stringify(out.headers) === JSON.stringify(["No", "Nama Komputer", "Alamat IP", "Workgroup", "OS Name", "Group Administrator", "Group User", "Itam Version", "Status Privilege", "Last Inventory", "Status"]),
    sortable10: out.sortableCount === 10,
    noCol: out.firstRowCells[0] === "1",
    deviceName: out.firstRowCells[1] === "PC-001",
    cellOrder: JSON.stringify(out.firstRowCells.slice(4, 10)) === JSON.stringify(["Windows 10 Pro x64 build 2", "Administrators", "users-1", "1.1.0", "OK", "2026-01-02"]),
    marquee4PerRow: out.marqueeCount === 15 * 4,
    statusPillOk: out.statusPills[0] === "mpc-kav-status--ok",
    problem12Headers: out.problemHeaders.length === 12,
    problemHasSource: out.problemHeaders[out.problemHeaders.length - 1] === "Source",
    problemFirstData: out.problemFirstRow[0] === "1" && out.problemFirstRow[1] === "PC-001",
    problemStatusDanger: container.querySelector("[data-itam-problem-rows] .mpc-kav-status")?.classList.contains("mpc-kav-status--danger")
  };

  out.checks = checks;
  out.RESULT = Object.values(checks).every(Boolean) ? "PASS" : "FAIL";
  document.getElementById("out").textContent = JSON.stringify(out, null, 2);
</script>
</body>
</html>
